# GitHub Actions workflow: збірка проєкту через репівський devcontainer.
#
# Ключова ідея: CI використовує ТОЙ САМИЙ Dockerfile що й локально у
# VS Code. Інакше "works on my machine" виникає постійно: локальний
# devcontainer має одні версії тулів, CI runner інші. Тут вони однакові.

name: Build

# Тригери:
# - push.branches: [main] - запускаємо тільки при push у main (тобто
#   при merge PR). Обмеження важливе: без нього push + pull_request
#   запускали б одну й ту саму збірку двічі на кожен update PR.
# - pull_request: запускаємо при відкритті PR і кожному update гілки.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # ubuntu-latest - загальний GitHub runner з preinstalled Docker і
    # актуальною Ubuntu. Для нашого випадку (build всередині
    # devcontainer-а) специфічний runner не потрібен.
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write

    steps:
      # Стандартний checkout коду. v4 - поточна стабільна major.
      - name: Checkout
        uses: actions/checkout@v4

      - name : Login to GitHub Container Registry
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name : Sanitize branch name 
        id : vars 
        run : |
          RAW_TAG="${{ github.head_ref || github.ref_name }}"
          CLEAN_TAG=$(echo "$RAW_TAG" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._]/-/g' | sed 's/^-//;s/-$//')
          echo "tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT

      - name: Build project
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          imageTag: ${{ steps.vars.outputs.tag }} 
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer:${{ steps.vars.outputs.tag }}
          push: always
          runCmd: |
            cmake --preset debug
            cmake --build --preset debug
            cmake --preset aarch64-debug
            cmake --build --preset aarch64-debug

      - name: Run tests
        run: ./build/debug/homework_06/drone_ballistic_tests

      - name: Check clang-formatter
        run : find homework_06 -type f -regex '.*\.\(cpp\|hpp\|h\|cc\|cxx\)' 
          -exec clang-format --style=file:.devcontainer/.clang-format --dry-run --Werror {} +
